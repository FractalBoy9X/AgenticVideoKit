<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<!-- Generic player for films/<slug>/film.json: index.html?film=<slug>[&play | &t=12.5] -->
<style>
  html, body { margin: 0; background: #000000; overflow: hidden; }
  #gl { display: block; }
  #hud { display: none; }
  body.preview #gl { margin: 0 auto; max-width: 100vw; height: calc(100vh - 24px) !important; width: auto !important; }
  #scrub { position: fixed; left: 0; right: 0; bottom: 0; display: none; }
  body.preview #scrub { display: block; }
  #scrub input { width: 100%; }
  #err { position: fixed; inset: 24px; color: #fb7185; font: 14px ui-monospace, Menlo, monospace; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="scrub"><input type="range" min="0" max="10" step="0.01" value="0"></div>
<script type="module" src="main.js"></script>
</body>
</html>
